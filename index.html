    <style>

<script>
    // ==================== DADOS GLOBAIS ====================
    let examesRaw = [];
    let consultasRaw = [];
    let groupedExames = new Map();
    let groupedConsultas = new Map();
    let currentTab = "exames";

    const fileExames = document.getElementById('fileExames');
    const fileConsultas = document.getElementById('fileConsultas');
    const searchInput = document.getElementById('searchInput');
    const listaExamesDiv = document.getElementById('listaExames');
    const listaConsultasDiv = document.getElementById('listaConsultas');
    const listaAmbosDiv = document.getElementById('listaAmbos');
    const logDiv = document.getElementById('log');
    const errorArea = document.getElementById('errorArea');

    function log(msg) {
        const p = document.createElement('div');
        p.textContent = new Date().toLocaleTimeString() + ' - ' + msg;
        logDiv.appendChild(p);
        logDiv.scrollTop = logDiv.scrollHeight;
        console.log(msg);
    }

    function showError(msg) {
        errorArea.style.display = 'block';
        errorArea.innerHTML += `<div>❌ ${msg}</div>`;
        log(msg);
    }

    function normalizar(texto) {
        if (texto === undefined || texto === null) return '';
        return String(texto).normalize('NFC').trim();
    }

    function parseData(valor) {
        if (!valor) return '';
        if (typeof valor === 'number') {
            const date = XLSX.SSF.parse_date_code(valor);
            if (date) return `${date.y}-${String(date.m).padStart(2,'0')}-${String(date.d).padStart(2,'0')}`;
        }
        let d = new Date(valor);
        if (!isNaN(d)) return d.toISOString().split('T')[0];
        let str = String(valor).split(' ')[0];
        let partes = str.split('/');
        if (partes.length === 3) return `${partes[2]}-${partes[1].padStart(2,'0')}-${partes[0].padStart(2,'0')}`;
        return str;
    }

    function parseHora(valor) {
        if (!valor) return '';
        if (typeof valor === 'number') {
            let totalSec = Math.round(valor * 24 * 3600);
            let h = Math.floor(totalSec / 3600);
            let m = Math.floor((totalSec % 3600) / 60);
            return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
        }
        let str = String(valor).substring(0,5);
        if (str.match(/^\d{2}:\d{2}$/)) return str;
        return '';
    }

    async function lerPlanilha(file) {
        return new Promise((resolve, reject) => {
            if (file.name.toLowerCase().endsWith('.csv')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const text = e.target.result;
                        const linhas = text.split(/\r?\n/).filter(l => l.trim().length > 0);
                        if (linhas.length === 0) reject('CSV vazio');
                        const separador = linhas[0].includes(';') ? ';' : ',';
                        const dados = linhas.map(line => line.split(separador).map(cell => cell.replace(/^"|"$/g, '').trim()));
                        const header = dados[0];
                        const rows = dados.slice(1);
                        resolve({ header, rows, allRows: [header, ...rows] });
                    } catch(err) { reject(err); }
                };
                reader.onerror = reject;
                reader.readAsText(file, 'UTF-8');
            } else {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const sheet = workbook.Sheets[workbook.SheetNames[0]];
                        let rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
                        if (!rows.length) reject('Planilha vazia');
                        const header = rows[0].map(c => normalizar(String(c || '')));
                        resolve({ header, rows: rows.slice(1), allRows: rows });
                    } catch(err) { reject(err); }
                };
                reader.onerror = reject;
                reader.readAsArrayBuffer(file);
            }
        });
    }

    // ==================== CARREGAR EXAMES ====================
    async function carregarExames() {
        const file = fileExames.files[0];
        if (!file) { alert('Selecione o arquivo de exames'); return; }
        document.getElementById('infoExames').innerText = file.name;
        try {
            const { header, rows } = await lerPlanilha(file);
            log('Cabeçalhos encontrados (exames): ' + header.join(', '));
            const findIndex = (patterns) => {
                for (let i = 0; i < header.length; i++) {
                    let col = header[i].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
                    for (let p of patterns) if (col.includes(p)) return i;
                }
                return -1;
            };
            const idx = {
                data: findIndex(['data agendada', 'dataagendada', 'data', 'dt']),
                hora: findIndex(['hora agendada', 'horaagendada', 'hora', 'horario']),
                matricula: findIndex(['matricula', 'matrícula', 'matr']),
                beneficiario: findIndex(['beneficiario', 'beneficiário', 'nome', 'paciente']),
                procedimento: findIndex(['procedimento', 'exame']),
                unidade: findIndex(['unidade', 'local']),
                andarSala: findIndex(['andar/sala', 'andar', 'sala']),
                medico: findIndex(['nome médico', 'nome medico', 'médico', 'medico']),
                status: findIndex(['status', 'situacao'])
            };
            if (idx.matricula === -1 || idx.beneficiario === -1) throw new Error('Colunas Matricula/Beneficiario não encontradas');
            examesRaw = [];
            for (let row of rows) {
                if (!row || row.every(c => !c)) continue;
                let status = (idx.status !== -1 ? normalizar(row[idx.status] || '') : '').toUpperCase();
                if (status && status !== 'ATIVADO' && status !== 'ATIVO') continue;
                examesRaw.push({
                    data: parseData(row[idx.data]),
                    hora: parseHora(row[idx.hora]),
                    matricula: normalizar(row[idx.matricula] || ''),
                    beneficiario: normalizar(row[idx.beneficiario] || ''),
                    procedimento: normalizar(row[idx.procedimento] || ''),
                    unidade: normalizar(row[idx.unidade] || ''),
                    andarSala: normalizar(row[idx.andarSala] || ''),
                    medico: normalizar(row[idx.medico] || '')
                });
            }
            log(`Exames carregados: ${examesRaw.length} registros ativos`);
            agruparExames();
            renderizarLista('exames');
            renderizarLista('ambos');
        } catch (err) { alert('Erro: '+err.message); showError(err.message); }
    }

    function agruparExames() {
        groupedExames.clear();
        for (let ex of examesRaw) {
            if (!ex.matricula || !ex.data) continue;
            let key = `${ex.matricula}|${ex.data}`;
            if (!groupedExames.has(key)) {
                groupedExames.set(key, {
                    matricula: ex.matricula,
                    beneficiario: ex.beneficiario,
                    data: ex.data,
                    itens: [],
                    nascimento: '',
                    acompanhante: 'Não'
                });
            }

    // ==================== CARREGAR CONSULTAS ====================
    async function carregarConsultas() {
        const file = fileConsultas.files[0];
        if (!file) { alert('Selecione o arquivo de consultas'); return; }
        document.getElementById('infoConsultas').innerText = file.name;
        try {
            const { header, rows } = await lerPlanilha(file);
            log('Cabeçalhos encontrados (consultas): ' + header.join(', '));
            const idx = {
                local: header.findIndex(h => /local/i.test(h)),
                profissional: header.findIndex(h => /profissional/i.test(h)),
                dataConsulta: header.findIndex(h => /data consulta/i.test(h)),
                hora: header.findIndex(h => /hora consulta/i.test(h)),
                beneficiario: header.findIndex(h => /beneficiario/i.test(h)),
                matricula: header.findIndex(h => /matricula/i.test(h)),
                subespecialidade: header.findIndex(h => /subespecialidade/i.test(h)),
                status: header.findIndex(h => /status/i.test(h))
            };
            if (idx.matricula === -1 || idx.beneficiario === -1) throw new Error('Colunas MATRICULA e/ou BENEFICIARIO não encontradas');
            consultasRaw = [];
            for (let row of rows) {
                if (!row || row.every(c => !c)) continue;
                const consulta = {
                    data: parseData(row[idx.dataConsulta]),
                    hora: parseHora(row[idx.hora]),
                    matricula: normalizar(row[idx.matricula] || ''),
                    beneficiario: normalizar(row[idx.beneficiario] || ''),
                    local: normalizar(row[idx.local] || ''),
                    profissional: normalizar(row[idx.profissional] || ''),
                    subespecialidade: normalizar(row[idx.subespecialidade] || '')
                };
                if (consulta.matricula && consulta.beneficiario && consulta.data) consultasRaw.push(consulta);
            }
            log(`Consultas carregadas: ${consultasRaw.length} registros ativos`);
            agruparConsultas();
            renderizarLista('consultas');
            renderizarLista('ambos');
        } catch (err) { alert('Erro consultas: ' + err.message); showError(err.message); }
    }

    function agruparConsultas() {
        groupedConsultas.clear();
        for (let c of consultasRaw) {
            if (!c.matricula || !c.data) continue;
            let key = `${c.matricula}|${c.data}`;
            if (!groupedConsultas.has(key)) {
                groupedConsultas.set(key, {
                    matricula: c.matricula,
                    beneficiario: c.beneficiario,
                    data: c.data,
                    itens: [],
                    nascimento: '',
                    acompanhante: 'Não'
                });
            }
            groupedConsultas.get(key).itens.push(c);
        }
        log(`Agrupados ${groupedConsultas.size} pacientes/dia para consultas`);
    }

    // ==================== FUNÇÃO ESCAPEHTML ====================
    function escapeHtml(str) {
        if (str === undefined || str === null) return '';
        const s = String(str);
        return s.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // ==================== GERAR PDF ====================
    async function htmlToPdf(htmlContent, filename, customSize = null) {
        const wrapper = document.createElement('div');
        wrapper.style.position = 'absolute';
        wrapper.style.left = '-9999px';
        wrapper.style.top = '-9999px';
        wrapper.innerHTML = htmlContent;
        document.body.appendChild(wrapper);
        await new Promise(r => setTimeout(r, 300));
        const canvas = await html2canvas(wrapper, { scale: 2, backgroundColor: '#fff', logging: false });
        document.body.removeChild(wrapper);
        const { jsPDF } = window.jspdf;
        let pdf = customSize ? new jsPDF({ orientation: 'portrait', unit: 'mm', format: customSize }) : new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
        const imgWidth = pdf.internal.pageSize.getWidth();
        const imgHeight = (canvas.height * imgWidth) / canvas.width;
        pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, imgWidth, imgHeight);
        return pdf.output('blob');
    }

    function gerarQRCodeDataURL(texto, tamanho=80) {
        const div = document.createElement('div');
        new QRCode(div, { text: texto, width: tamanho, height: tamanho });
        const canvas = div.querySelector('canvas');
        return canvas ? canvas.toDataURL() : '';
    }

        const nasc = document.getElementById('encaixeNascimento').value;
        const acomp = document.getElementById('encaixeAcompanhante').value;
        const data = document.getElementById('encaixeData').value;
        const hora = document.getElementById('encaixeHora').value;
        const tipo = document.getElementById('encaixeTipo').value;
        const procedimentoEspec = document.getElementById('encaixeProcedimento').value.trim();
        const unidade = document.getElementById('encaixeLocal').value;
        const sala = document.getElementById('encaixeSala').value.trim();
        const profissional = document.getElementById('encaixeProfissional').value;
        const obs = document.getElementById('encaixeObs').value;
        if (!mat || !nome || !nasc || !data || !hora || !procedimentoEspec) { alert('Preencha todos os campos obrigatórios'); return; }
        const grupo = { matricula: mat, beneficiario: nome, data: data, nascimento: nasc, acompanhante: acomp, itens: tipo === 'exame' ? [{ procedimento: procedimentoEspec, hora: hora, unidade: unidade, andarSala: sala, medico: profissional, obs: obs }] : [{ subespecialidade: procedimentoEspec, hora: hora, local: unidade, profissional: profissional, obs: obs }] };
        if (tipo === 'exame') gerarFichaEncaixeExame(grupo);
        else gerarFichaEncaixeConsulta(grupo);
    }

    async function gerarFichaEncaixeExame(grupo) {
        const html = montarHTMLEncaixeExame(grupo);
        const pdfBlob = await htmlToPdf(html, `Encaixe_Exame_${grupo.matricula}_${grupo.data}.pdf`);
        saveAs(pdfBlob, `Encaixe_Exame_${grupo.matricula}_${grupo.data}.pdf`);
        log(`✅ Gerado: Encaixe Exame para ${grupo.beneficiario}`);
    }

    async function gerarFichaEncaixeConsulta(grupo) {
        const html = montarHTMLEncaixeConsulta(grupo);
        const pdfBlob = await htmlToPdf(html, `Encaixe_Consulta_${grupo.matricula}_${grupo.data}.pdf`);
        saveAs(pdfBlob, `Encaixe_Consulta_${grupo.matricula}_${grupo.data}.pdf`);
        log(`✅ Gerado: Encaixe Consulta para ${grupo.beneficiario}`);
    }

    function montarHTMLEncaixeExame(grupo) {
        const dataFormat = grupo.data.split('-').reverse().join('/');
        const nasc = grupo.nascimento.split('-').reverse().join('/');
        const ex = grupo.itens[0];
        return `<div style="font-family: 'Segoe UI', Arial, sans-serif; width: 210mm; min-height: 297mm; margin: 0 auto; background: white; padding: 8mm 10mm; box-sizing: border-box; font-size: 12px;"><div style="background: #002b49; color: white; padding: 5mm; text-align: center; font-size: 14px; font-weight: bold; margin-bottom: 6mm;">FICHA DE ATENDIMENTO EXAMES - ENCAIXE</div><div><strong>Beneficiário:</strong> ${escapeHtml(grupo.beneficiario)}</div><div><strong>Matrícula:</strong> ${escapeHtml(grupo.matricula)}</div><div><strong>Nascimento:</strong> ${nasc} | <strong>Acompanhante:</strong> ${grupo.acompanhante}</div><div><strong>Data:</strong> ${dataFormat} às ${ex.hora}</div><hr><h3 style="font-size: 14px; font-weight: bold;">📋 Procedimento</h3><p><strong>Procedimento:</strong> ${escapeHtml(ex.procedimento)}<br><strong>Unidade:</strong> ${escapeHtml(ex.unidade)} | Sala: ${escapeHtml(ex.andarSala)}<br><strong>Profissional:</strong> ${escapeHtml(ex.medico)}</p>${ex.obs ? `<div><strong>Observação:</strong> ${escapeHtml(ex.obs)}</div>` : ''}${montarRodape(ex.unidade)}</div>`;
    }

    function montarHTMLEncaixeConsulta(grupo) {
        const dataFormat = grupo.data.split('-').reverse().join('/');
        const cons = grupo.itens[0];
        const linhaGrande = '<div style="margin-bottom: 6px; border-bottom: 1px solid #000; width: 100%;">&nbsp;</div>';
        function cincoLinhas() { return `<div style="margin-top: 4px;">${linhaGrande}${linhaGrande}${linhaGrande}${linhaGrande}${linhaGrande}</div>`; }
        return `<div style="font-family: 'Segoe UI', Arial, sans-serif; width: 210mm; min-height: 297mm; margin: 0 auto; background: white; padding: 8mm 10mm; box-sizing: border-box; font-size: 12px;"><div style="background: #002b49; color: white; padding: 5mm; text-align: center; font-size: 14px; font-weight: bold; margin-bottom: 6mm;">FICHA DE ATENDIMENTO CONSULTAS - ENCAIXE</div><div><strong>Beneficiário:</strong> ${escapeHtml(grupo.beneficiario)}</div><div><strong>Matrícula:</strong> ${escapeHtml(grupo.matricula)}</div><div><strong>Nascimento:</strong> ${grupo.nascimento.split('-').reverse().join('/')} | <strong>Acompanhante:</strong> ${grupo.acompanhante}</div><div><strong>Data:</strong> ${dataFormat} às ${cons.hora}</div><div><strong>Local:</strong> ${escapeHtml(cons.local)} | <strong>Profissional:</strong> ${escapeHtml(cons.profissional)} | <strong>Especialidade:</strong> ${escapeHtml(cons.subespecialidade)}</div>${cons.obs ? `<div><strong>Observação:</strong> ${escapeHtml(cons.obs)}</div>` : ''}<hr><h3 style="font-size: 14px; font-weight: bold;">📋 Anamnese</h3><div><div><strong>🩺 1. Queixa Principal (QP)</strong>${cincoLinhas()}</div><div style="margin-top: 5mm;"><strong>📖 2. História da Doença Atual (HDA)</strong><br>Início: ___________ Duração: ___________ Intensidade: ___________<br>Fatores de melhora/piora: ___________ Sintomas associados: ___________</div><div style="margin-top: 5mm;"><strong>🧬 3. Antecedentes Pessoais:</strong><br>( ) Diabetes ( ) Hipertensão ( ) Cardiopatias ( ) Outros: ___________<br>Cirurgias prévias: ___________ Internações: ___________</div><div style="margin-top: 5mm;"><strong>💊 4. Uso de Medicamentos:</strong> ( ) Não ( ) Sim → Quais: ___________</div><div><strong>⚠️ 5. Alergias:</strong> ( ) Não ( ) Sim → Quais: ___________</div><div style="margin-top: 5mm;"><strong>👨‍👩‍👧 6. Antecedentes Familiares:</strong>${cincoLinhas()}</div><div style="margin-top: 5mm;"><strong>🍷 7. Hábitos de Vida:</strong> Tabagismo ( ) Não ( ) Sim | Álcool ( ) Não ( ) Sim | Atividade física ( ) Não ( ) Sim</div><div style="margin-top: 5mm;"><strong>📋 8. Observações Gerais:</strong>${cincoLinhas()}</div><div style="margin-top: 5mm;"><strong>🧾 9. Conduta / Orientações:</strong>${cincoLinhas()}</div></div>${montarRodape(cons.local)}</div>`;
    }

    function montarEtiqueta(grupo) {
        const nasc = grupo.nascimento ? grupo.nascimento.split('-').reverse().join('/') : '___________';
        return `<div style="font-family: monospace; width: 90mm; padding: 8mm; text-align: center; border: 1px dashed #000;"><h3>ETIQUETA DE EXAME</h3><p><strong>${escapeHtml(grupo.beneficiario)}</strong></p><p>Matrícula: ${escapeHtml(grupo.matricula)}</p><p>Nascimento: ${nasc}</p></div>`;
    }

    // ==================== EVENTOS ====================
    document.getElementById('btnCarregarExames').onclick = carregarExames;
    document.getElementById('btnCarregarConsultas').onclick = carregarConsultas;
    document.getElementById('btnGerarManual').onclick = gerarLivreDemanda;
    document.getElementById('btnGerarEncaixe').onclick = gerarEncaixe;
    searchInput.oninput = () => renderizarLista(currentTab);
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentTab = btn.dataset.tab;
            document.getElementById('examesPanel').style.display = currentTab === 'exames' ? 'block' : 'none';
            document.getElementById('consultasPanel').style.display = currentTab === 'consultas' ? 'block' : 'none';
            document.getElementById('ambosPanel').style.display = currentTab === 'ambos' ? 'block' : 'none';
            renderizarLista(currentTab);
        };
    });
    document.getElementById('manualData').valueAsDate = new Date();
    document.getElementById('encaixeData').valueAsDate = new Date();
</script>
</body>
</html>
